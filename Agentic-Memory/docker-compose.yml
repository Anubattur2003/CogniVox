version: '3.8'

services:
  api:
    build: .
    container_name: cognivox-memory
    ports:
      - "8002:8000"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - GRAPHRAG_API_URL=http://graphrag:8000
      - MEMORY_PORT=8002
    depends_on:
      - mongodb
      - ollama
      - graphrag
    networks:
      - cognivox-network

  mongodb:
    image: mongo:latest
    container_name: cognivox-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cognivox
      MONGO_INITDB_ROOT_PASSWORD: cognivox
      MONGO_INITDB_DATABASE: cognivox
    volumes:
      - mongodb_data:/data/db
    networks:
      - cognivox-network

  ollama:
    image: ollama/ollama:latest
    container_name: cognivox-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - cognivox-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  graphrag:
    # Reference the GraphRAG API service
    build:
      context: ../Agentic-Graph-RAG
      dockerfile: Dockerfile
    container_name: cognivox-graphrag
    ports:
      - "8003:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_HOST=http://ollama:11434
      - VECTOR_STORE_PATH=/app/data/db/vectors
      - PDF_STORAGE_PATH=/app/data/pdfs
      - COGNIVOX_API_PORT=8000
      - LOG_LEVEL=INFO
      - MEMORY_SERVICE_URL=http://api:8000
      - MEMORY_PORT=8002
    volumes:
      - graphrag_pdf_data:/app/data/pdfs
      - graphrag_vector_data:/app/data/db/vectors
    depends_on:
      - neo4j
      - ollama
    networks:
      - cognivox-network

  neo4j:
    image: neo4j:latest
    container_name: cognivox-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - cognivox-network

networks:
  cognivox-network:
    driver: bridge

volumes:
  mongodb_data:
  ollama_models:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  graphrag_pdf_data:
  graphrag_vector_data: 