version: '3.8'

services:
  cognivox-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognivox-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_HOST=http://ollama:11434
      - VECTOR_STORE_PATH=/app/data/db/vectors
      - PDF_STORAGE_PATH=/app/data/pdfs
      - COGNIVOX_API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - pdf_data:/app/data/pdfs
      - vector_data:/app/data/db/vectors
    networks:
      - cognivox-network
    depends_on:
      - neo4j
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 30s

  neo4j:
    image: neo4j:latest
    container_name: cognivox-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - cognivox-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 300s
      timeout: 15s
      retries: 2
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: cognivox-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cognivox-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  ollama_data:
  pdf_data:
  vector_data:

networks:
  cognivox-network:
    driver: bridge 