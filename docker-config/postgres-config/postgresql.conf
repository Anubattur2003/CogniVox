# Connection Settings
listen_addresses = '*'
port = 5432

# Memory Settings
shared_buffers = 128MB
dynamic_shared_memory_type = posix

# Security and Authentication
password_encryption = scram-sha-256

# Logging Settings
log_timezone = 'UTC'
log_statement = 'none'
log_min_messages = warning

# Query Tuning
random_page_cost = 1.1
effective_cache_size = 4GB 